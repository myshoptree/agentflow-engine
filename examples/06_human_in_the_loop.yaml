id: human-in-the-loop
version: "1.0.0"
name: Human-in-the-loop — confirmación humana antes de ejecutar acción
entry_node: analyzer

# Patrón: el grafo se suspende en human_input esperando confirmación del usuario.
# Flujo:
#   1. analyzer clasifica la solicitud y calcula el impacto
#   2. human_input suspende → muestra resumen al usuario y pide confirmación
#   3. Al resumir, el edge condicional enruta directamente según la respuesta:
#      - Approve (si/sí/yes/s) → executor procesa la acción
#      - Reject (cualquier otra respuesta) → canceller responde con cancelación

state_schema:
  - name: user_request
    type: str
    required: true
  - name: action_summary
    type: str
    default: ""
  - name: impact_level
    type: str
    default: ""
  - name: confirmation
    type: str
    default: ""
  - name: result
    type: str
    default: ""

global_timeout_seconds: 300  # 5 min para que el humano responda
max_depth: 10

nodes:
  analyzer:
    type: agent
    config:
      model: "openai:gpt-4o-mini"
      system_prompt: |
        Analiza la solicitud del usuario y prepara un resumen de la acción a ejecutar.
        Determina el nivel de impacto: "alto", "medio" o "bajo".

        - alto: acciones irreversibles (eliminar datos, enviar comunicaciones masivas, cargos económicos)
        - medio: cambios importantes pero reversibles (cambiar configuración, modificar registros)
        - bajo: consultas o cambios menores

        Devuelve un resumen claro de QUÉ se va a hacer (máximo 2 oraciones) y el nivel de impacto.
      output_schema: "examples.schemas.ActionAnalysisOutput"
      state_output_mapping:
        action_summary: action_summary
        impact_level: impact_level

  await_confirmation:
    type: human_input
    config:
      prompt: "¿Confirmas esta acción?"
      input_mapping:
        confirmation: confirmation

  executor:
    type: agent
    config:
      model: "openai:gpt-4o-mini"
      system_prompt: |
        El usuario confirmó la acción. Simula la ejecución y reporta el resultado
        de forma clara: qué se hizo, cuándo y con qué resultado.
        Sé específico y profesional.
      output_schema: "examples.schemas.ResultOutput"
      state_output_mapping:
        result: result

  canceller:
    type: agent
    config:
      model: "openai:gpt-4o-mini"
      system_prompt: |
        El usuario canceló la acción. Confirma la cancelación de forma amable,
        asegura que no se realizó ningún cambio y ofrece asistencia adicional.
      output_schema: "examples.schemas.ResultOutput"
      state_output_mapping:
        result: result

  end:
    type: end
    config: {}

edges:
  - from_node: analyzer
    to_node: await_confirmation

  # Approve — edges condicionales (prioridad alta), se evalúan con el input ya en estado
  - from_node: await_confirmation
    to_node: executor
    condition: {field: state.confirmation, operator: eq, value: "si"}
    priority: 10
  - from_node: await_confirmation
    to_node: executor
    condition: {field: state.confirmation, operator: eq, value: "sí"}
    priority: 10
  - from_node: await_confirmation
    to_node: executor
    condition: {field: state.confirmation, operator: eq, value: "yes"}
    priority: 10
  - from_node: await_confirmation
    to_node: executor
    condition: {field: state.confirmation, operator: eq, value: "s"}
    priority: 10

  # Reject — fallback incondicional
  - from_node: await_confirmation
    to_node: canceller

  - from_node: executor
    to_node: end
  - from_node: canceller
    to_node: end
